name: "Flake.lock: update Nix dependencies"

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  nix-flake-update:
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
      actions: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/determinate-nix-action@v3
      - id: update
        uses: DeterminateSystems/update-flake-lock@main
        with:
          pr-title: "Update Nix flake inputs"
          pr-labels: |
            dependencies
      - if: success() && steps.update.outputs.pull-request-number != ''
        run: |
          gh pr merge --merge --delete-branch ${{ steps.update.outputs.pull-request-number }}
          gh workflow run cache.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
