name: Publish Nix Binary Cache

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish-cache:
    runs-on: ubuntu-latest

    env:
      CACHE_DIR: cache

    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Write signing key
        run: |
          echo "${{ secrets.NIX_CACHE_PRIVATE_KEY }}" > $RUNNER_TEMP/cache-key.pem
          chmod 600 $RUNNER_TEMP/cache-key.pem

      - name: Build and Export Cache
        run: |
          set -euo pipefail
          mkdir -p "$CACHE_DIR"

          # 1. Build ONLY the default output. 
          # This avoids pulling in 'dev' dependencies like clang-wrapper.
          nix build '.#default' --print-out-paths > /tmp/output-paths.txt

          # 2. Get the runtime closure
          mapfile -t closure < <(nix path-info -r $(cat /tmp/output-paths.txt))

          # 3. Filter out paths already in cache.nixos.org
          paths=()
          for path in "${closure[@]}"; do
            if nix path-info --store "https://cache.nixos.org" "$path" >/dev/null 2>&1; then
              echo "skip  (in cache.nixos.org): $path"
            else
              echo "keep  (missing upstream) : $path"
              paths+=("$path")
            fi
          done

          if [ "${#paths[@]}" -eq 0 ]; then
            echo "Everything is already available from cache.nixos.org"
            exit 0
          fi

          # 4. Export to local directory. 
          # No URL rewriting needed! Relative URLs work perfectly on GitHub Pages.
          nix copy \
            --to "file://$PWD/$CACHE_DIR?secret-key=$RUNNER_TEMP/cache-key.pem" \
            "${paths[@]}"

          # 5. Verify signatures
          grep '^Sig:' "$CACHE_DIR"/*.narinfo

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./cache
          publish_branch: gh-pages
          # keep_files: true # Uncomment if you want to keep old cache files instead of overwriting
