name: Build and Cache

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.1.7

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build Nix flake
        run: nix build .#default --out-link result

      - name: Export and sign Nix store paths
        env:
          NIX_PRIVATE_KEY: ${{ secrets.NIX_CACHE_PRIVATE_KEY }}
        run: |
          echo "$NIX_PRIVATE_KEY" > cache-key.pem
          STORE_PATHS=$(nix-store --query --requisites ./result)
          nix copy \
            --to "file://$PWD/cache?secret-key=$PWD/cache-key.pem" \
            $STORE_PATHS
          rm cache-key.pem

      - name: Separate .narinfo (Pages) and .nar (Releases)
        run: |
          mkdir -p pages-dir release-dir
          
          # 1. Move nix-cache-info
          [ -f cache/nix-cache-info ] && mv cache/nix-cache-info pages-dir/
          
          # 2. Define the GitHub Release download URL
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/download/nix-cache"
          
          # 3. Process .narinfo files with a single, robust sed command
          shopt -s nullglob
          for narinfo in cache/*.narinfo; do
            # This directly replaces "URL: nar/" with the release URL.
            # It doesn't matter what the filename is; it keeps it intact.
            sed -i "s|URL: nar/|URL: ${RELEASE_URL}/|g" "$narinfo"
            
            # Debug: Ensure the rewrite worked
            if grep -q "URL: nar/" "$narinfo"; then
              echo "ERROR: Failed to rewrite URL in $narinfo"
              cat "$narinfo"
              exit 1
            fi
            
            mv "$narinfo" pages-dir/
          done
          
          # 4. Move the actual .nar binaries to the Release directory
          find cache/ -type f ! -name "*.narinfo" ! -name "nix-cache-info" -exec mv {} release-dir/ \;

      - name: Delete previous cache release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete nix-cache --yes --cleanup-tag || true

      - name: Create new release and upload .nar files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create nix-cache \
            --title "Nix Binary Cache" \
            --notes "Automated Nix binary cache binaries"
            
          if [ -n "$(ls -A release-dir)" ]; then
            gh release upload nix-cache release-dir/* --clobber
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: ./pages-dir

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4.0.5
